<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">ToDo — exact reminders, quiet by design</title>
  <desc id="bannerDesc">A dark banner with the ToDo wordmark, Shamsi calendar tile, and a reminder card showing a typed time of 09:30 PM, a custom sound called Antimony, and Mark done and Snooze actions.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15131F"/>
      <stop offset="0.55" stop-color="#0F0E16"/>
      <stop offset="1" stop-color="#0B0A11"/>
    </linearGradient>

    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F2FF"/>
      <stop offset="0.55" stop-color="#C7C3FF"/>
      <stop offset="1" stop-color="#8B8DFF"/>
    </linearGradient>

    <linearGradient id="iconFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B8DFF"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9A5FF"/>
      <stop offset="1" stop-color="#5AD9CC"/>
    </linearGradient>

    <linearGradient id="cardFill" x1="842" y1="86" x2="1190" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D1A2A"/>
      <stop offset="1" stop-color="#15131E"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4B4666" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#2A2738" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3A3550" stop-opacity="0.85"/>
    </linearGradient>

    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6D5DF6" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#6D5DF6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6D5DF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#2DD4BF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="tileShadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.42"/>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="320" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <ellipse cx="250" cy="-20" rx="480" ry="300" fill="url(#glowPurple)"/>
    <ellipse cx="1130" cy="340" rx="420" ry="280" fill="url(#glowTeal)"/>

    <g fill="none" stroke="#8B8DFF" stroke-opacity="0.16" stroke-width="1.2">
      <path d="M694 48h12M700 42v12"/>
      <path d="M1224 236h10M1229 231v10"/>
    </g>
    <circle cx="1000" cy="160" r="188" fill="none" stroke="#8B8DFF" stroke-opacity="0.10" stroke-width="1.2"/>
    <circle cx="1000" cy="160" r="146" fill="none" stroke="#A9A5FF" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 9"/>
  </g>

  <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="27.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
    <!-- Brand mark -->
    <g filter="url(#tileShadow)">
      <rect x="72" y="62" width="62" height="62" rx="18" fill="url(#iconFill)"/>
      <rect x="72.6" y="62.6" width="60.8" height="60.8" rx="17.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <g transform="translate(86.6 76.6) scale(1.4)">
        <path fill="#FFFFFF" d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
      </g>
    </g>

    <text x="152" y="114" font-size="64" font-weight="700" letter-spacing="-2.2" fill="url(#brand)">ToDo</text>
    <circle cx="330" cy="103" r="5" fill="#5AD9CC"/>

    <text x="153" y="151" font-size="19" font-weight="500" fill="#D9D5E8">Exact reminders, quiet by design.</text>

    <!-- Feature pills -->
    <g font-size="13.5" font-weight="500">
      <g>
        <rect x="72" y="178" width="150" height="34" rx="17" fill="#1A1824" stroke="#353143"/>
        <circle cx="91" cy="195" r="3.4" fill="#5AD9CC"/>
        <text x="103" y="199.6" fill="#C9C5D8">Shamsi calendar</text>
      </g>
      <g>
        <rect x="234" y="178" width="176" height="34" rx="17" fill="#1A1824" stroke="#353143"/>
        <circle cx="253" cy="195" r="3.4" fill="#A9A5FF"/>
        <text x="265" y="199.6" fill="#C9C5D8">Typed hh:mm AM/PM</text>
      </g>
      <g>
        <rect x="422" y="178" width="178" height="34" rx="17" fill="#1A1824" stroke="#353143"/>
        <circle cx="441" cy="195" r="3.4" fill="#FBBF24"/>
        <text x="453" y="199.6" fill="#C9C5D8">Per-reminder sound</text>
      </g>
    </g>

    <text x="72" y="266" font-size="13" fill="#807C95">Android 8.0+ · Kotlin · Material 3 · No account, cloud, or analytics</text>

    <!-- Version tag -->
    <g>
      <rect x="1146" y="38" width="70" height="27" rx="13.5" fill="#1A1824" stroke="#353143"/>
      <circle cx="1161" cy="51.5" r="3" fill="#5AD9CC"/>
      <text x="1171" y="55.6" font-size="11.5" font-weight="600" letter-spacing="0.4" fill="#BEBACF">v1.2</text>
    </g>

    <!-- Calendar tile -->
    <g filter="url(#tileShadow)">
      <rect x="736" y="86" width="132" height="150" rx="22" fill="#17161F" stroke="#2E2A40"/>
      <rect x="736.6" y="86.6" width="130.8" height="148.8" rx="21.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </g>
    <text x="802" y="113" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="2.4" fill="#A9A5FF">ABAN</text>
    <text x="802" y="168" text-anchor="middle" font-size="58" font-weight="700" letter-spacing="-2" fill="#F1EFFA">25</text>
    <text x="802" y="191" text-anchor="middle" font-size="11.5" font-weight="500" letter-spacing="1.2" fill="#807C95">1405</text>
    <path d="M774 205h56" stroke="#2A2738" stroke-width="1"/>
    <text x="802" y="224" text-anchor="middle" font-size="9" font-weight="600" letter-spacing="1.8" fill="#5AD9CC">MON</text>

    <!-- Reminder card -->
    <g filter="url(#softShadow)">
      <rect x="842" y="86" width="348" height="150" rx="22" fill="url(#cardFill)" stroke="#3A3550"/>
      <rect x="842.6" y="86.6" width="346.8" height="148.8" rx="21.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </g>

    <rect x="860" y="104" width="36" height="36" rx="11" fill="#2A2542"/>
    <g transform="translate(869 113) scale(0.75)">
      <path fill="#A9A5FF" d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
    </g>
    <text x="908" y="122" font-size="16.5" font-weight="600" fill="#F1EFFA">Reminder</text>
    <text x="908" y="142" font-size="13" fill="#A5A1B8">Mon 25 Aban · 09:30 PM</text>

    <path d="M860 158h312" stroke="#2A2738" stroke-width="1"/>

    <g transform="translate(860 168) scale(0.8)">
      <path fill="#A9A5FF" d="M12 3v10.55A4 4 0 1 0 14 18V7h4V3h-6z"/>
    </g>
    <text x="886" y="183" font-size="13" font-weight="500" fill="#D9D5E8">Antimony</text>

    <rect x="1068" y="167" width="108" height="23" rx="11.5" fill="#242033" stroke="#3A3550"/>
    <text x="1122" y="182.6" text-anchor="middle" font-size="9" font-weight="600" letter-spacing="1.1" fill="#A9A5FF">CUSTOM SOUND</text>

    <text x="860" y="218" font-size="11.5" fill="#807C95">High-importance alert · its own channel</text>

    <!-- Notification actions -->
    <g font-size="12" font-weight="500">
      <g>
        <rect x="842" y="250" width="120" height="30" rx="15" fill="#1D1A29" stroke="#353143"/>
        <g transform="translate(857 259) scale(0.5)">
          <path fill="#5AD9CC" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </g>
        <text x="877" y="269.4" fill="#D9D5E8">Mark done</text>
      </g>
      <g>
        <rect x="974" y="250" width="138" height="30" rx="15" fill="#1D1A29" stroke="#353143"/>
        <g transform="translate(989 259) scale(0.5)">
          <path fill="#A5A1B8" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
        </g>
        <text x="1009" y="269.4" fill="#C9C5D8">Snooze 10 min</text>
      </g>
    </g>
  </g>
</svg>
